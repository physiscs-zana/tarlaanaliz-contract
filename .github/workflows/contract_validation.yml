name: Contract Validation

# ⚠️ KADEME 0 / D1 + D4 (2026-07-31) — "kapılar dürüst hale gelsin" turu.
# Bu dosyada üç ayrı YALAN düzeltildi (hepsi ölçülerek doğrulandı):
#   1. `detect-breaking-changes` adımı `continue-on-error: true` taşıyordu ve son adım
#      "Don't fail - just warn" diyordu → breaking değişiklik HİÇ bloke etmiyordu (SD3).
#   2. Dedektör ilerleme metnini stdout'a basıyordu; `--json > breaking_changes.json`
#      yönlendirmesi geçersiz JSON üretiyor, `json.load` patlıyor ve `if` bloğu else
#      dalına düşerek **has_breaking=false** yazıyordu → kapı DAİMA "breaking yok" derdi.
#      (Bu oturumda bulundu; araç tarafı `tools/breaking_change_detector.py`'de düzeltildi.)
#   3. `verify-checksums` işi `summary.needs`'te yoktu → checksum uyuşmazlığı özet
#      kapısını hiç etkilemiyordu (SD5).
# Ayrıca `paths:` filtresi testlerin okuduğu kaynakları kapsamıyordu (Q7) ve `pyyaml`
# kurulmadığı için 18 test SESSİZCE atlanıyordu (Q2). İkisi de aşağıda kapatıldı.

on:
  pull_request:
    branches: [master]
    # Filtre, testlerin GERÇEKTEN okuduğu yollardan türetildi (ölçüm: tests/*.py içindeki
    # ROOT/WORKSPACE yolları). Dar filtre, yeni testlerin kaynaklarını kapsamadığı için
    # kapıyı sessizce karartıyordu (Q7).
    paths:
      - 'schemas/**'
      - 'enums/**'
      - 'api/**'
      - 'tools/**'
      - 'tests/**'
      - 'ssot/**'                    # test_kr_reference_integrity → kr_registry.md
      - 'docs/**'                    # examples/, TARLAANALIZ_SSOT_v1_2_0.txt, versioning_policy
      - 'drone_capability_matrix.yaml'  # test_calibrated_manifest_fields
      - 'CONTRACTS_VERSION.md'
      - 'requirements-dev.txt'       # CI bağımlılıkları buradan kurulur
      - 'pyproject.toml'             # pytest markers/config
      - '.github/workflows/contract_validation.yml'
  push:
    branches: [master]
    paths:
      - 'schemas/**'
      - 'enums/**'
      - 'api/**'
      - 'tools/**'
      - 'tests/**'
      - 'ssot/**'
      - 'docs/**'
      - 'drone_capability_matrix.yaml'
      - 'CONTRACTS_VERSION.md'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/contract_validation.yml'

# Default GITHUB_TOKEN is read-only; the breaking-change job posts a PR comment
# (issues.createComment) -> needs pull-requests: write. Without it the comment
# step fails "Resource not accessible by integration" and fails the job.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for breaking change detection

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        # TEK KAYNAK: bağımlılıklar requirements-dev.txt'ten kurulur. Eskiden burada
        # elle yazılmış bir liste vardı (`jsonschema pytest pytest-cov`) ve pyproject.toml
        # ile ayrışmıştı → `pyyaml` yoktu → 18 test sessizce atlanıyordu (Q2).
        run: |
          pip install --break-system-packages -r requirements-dev.txt

      - name: Run schema validator
        id: validate
        run: |
          python3 tools/validate.py
        continue-on-error: false

      - name: Check validation output
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          echo "::error::Schema validation failed!"
          echo "::error::Please fix validation errors and try again."
          exit 1

  test-schemas:
    name: Test Schemas and Examples
    runs-on: ubuntu-latest
    needs: validate-schemas

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # ÖD-16 (2026-08-01): süit artık CHANGELOG'da YAYIMLANAN dedektör komutlarının
          # bugün çözülebilir olduğunu zorluyor (`--old v7.2.0` gibi). Varsayılan sığ
          # checkout ETİKET GETİRMEZ → kapı yerelde yeşil, CI'da kırmızı olur ve
          # gerekçesi "komut bozuk" sanılır. Tam geçmiş + etiketler bu yüzden gerekli;
          # aynı ihtiyaç `tools/breaking_change_detector.py --old <tag>` için de var.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --break-system-packages -r requirements-dev.txt

      - name: Run pytest
        # `-rs`: atlanan testlerin GEREKÇESİ yazdırılır. Sessiz atlama yeşil sayılmaz —
        # tests/conftest.py beyan edilmemiş her atlama gerekçesinde oturumu düşürür.
        run: |
          set -o pipefail
          pytest tests/ -v -rs --cov=schemas --cov-report=term-missing --cov-report=xml \
            | tee pytest.log

      - name: Report skip budget (silent skips are NOT green)
        if: always()
        run: |
          {
            echo "### Skip bütçesi (atlanan testler)"
            echo ""
            if grep -q "^SKIP BÜTÇESİ" pytest.log; then
              echo '```'
              grep -E "^SKIP BÜTÇESİ|^  \[" pytest.log
              echo '```'
            else
              echo "_pytest çıktısı okunamadı (koşum erken düştü)._"
            fi
            echo ""
            if grep -qE "^  \[beyanlı\].*kardeş depo yok" pytest.log; then
              echo "⚠️ **Vendored parite kapısı bu koşumda ÇALIŞMADI** — kardeş depolar"
              echo "(tarlaanaliz-edge / -worker) GitHub Actions'ta checkout edilmiyor."
              echo "Bu kapı **C8 release töreninde YEREL olarak** koşulmak zorundadır"
              echo "(\`docs/checklists/SDLC_GATES.md\` §3C). Atlanmış olması 'geçti' DEĞİLDİR."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: schemas
          name: schema-tests
        if: always()

  detect-breaking-changes:
    name: Detect Breaking Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          path: new

      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}
          path: old

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Detect breaking changes
        id: breaking
        # continue-on-error KALDIRILDI (SD3). Çıkış kodu sözleşmesi:
        #   0 = breaking yok · 1 = breaking var · >=2 = ARAÇ ÇALIŞAMADI (kapı kör)
        run: |
          cd new
          set +e
          python3 tools/breaking_change_detector.py --old ../old --new . --json > breaking_changes.json
          RC=$?
          set -e
          echo "detector exit code: $RC"

          if [ "$RC" -ge 2 ]; then
            echo "::error::breaking_change_detector ÇALIŞAMADI (exit $RC) — kapı KÖR, 'breaking yok' DEĞİL."
            exit 1
          fi

          # Bozuk JSON asla "breaking yok" diye okunamaz (2026-07-31 banner hatası).
          if ! python3 -c "import json; json.load(open('breaking_changes.json'))"; then
            echo "::error::breaking_changes.json geçerli JSON değil — kapı rapor üretemiyor."
            exit 1
          fi

          HAS=$(python3 -c "import json; print('true' if json.load(open('breaking_changes.json'))['has_breaking'] else 'false')")
          echo "has_breaking=$HAS" >> "$GITHUB_OUTPUT"
          python3 -c "import json; d=json.load(open('breaking_changes.json')); print('breaking={} non_breaking={} documentation={}'.format(len(d['breaking']), len(d['non_breaking']), len(d['documentation'])))"

      - name: Generate PR comment
        id: comment
        if: always()
        run: |
          cd new
          python3 tools/breaking_change_detector.py \
            --old ../old \
            --new . \
            --pr-comment > pr_comment.md || true

      - name: Post PR comment
        uses: actions/github-script@v8
        if: always()
        continue-on-error: true  # informational comment; never fail CI on posting
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('new/pr_comment.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Enforce breaking-change declaration
        if: steps.breaking.outputs.has_breaking == 'true'
        # Breaking değişiklik YASAK DEĞİLDİR — BEYAN EDİLMEMİŞ olması yasaktır.
        # Beyan yeri: CONTRACTS_VERSION.md `**Breaking Change:** YES` (MAJOR bump).
        run: |
          cd new
          if grep -qE '^\*\*Breaking Change:\*\*[[:space:]]*YES' CONTRACTS_VERSION.md; then
            echo "::warning::Breaking değişiklik tespit edildi ve BEYAN EDİLDİ (Breaking Change: YES)."
            echo "Migration guide + tüketici koordinasyonu zorunlu (SDLC_GATES §1C/§3B)."
          else
            echo "::error::BEYAN EDİLMEMİŞ breaking değişiklik. MAJOR bump + migration guide gerekir."
            echo "::error::Kasıtlıysa: python3 tools/pin_version.py --major --breaking"
            python3 -c "import json; d=json.load(open('breaking_changes.json')); [print(' -', c['message']) for c in d['breaking']]"
            exit 1
          fi

  verify-checksums:
    name: Verify Contract Checksums
    runs-on: ubuntu-latest
    needs: validate-schemas

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify checksums
        # SEC-FIX: continue-on-error removed — checksum mismatch now fails the build [KR-041]
        # D1 (2026-07-31): dosya yokluğu artık "atla" değil HATA; uyuşmazlık ise yalnız
        # CONTRACTS_VERSION.md'de BEYAN EDİLMİŞSE (PENDING_REPIN) uyarıya düşer.
        run: |
          if [ ! -f CONTRACTS_VERSION.md ]; then
            echo "::error::CONTRACTS_VERSION.md yok — checksum kapısı koşamaz."
            exit 1
          fi

          set +e
          python3 tools/pin_version.py --verify
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "✅ Contracts checksum doğrulandı."
            exit 0
          fi

          if grep -qE '^\*\*Checksum State:\*\*[[:space:]]*PENDING_REPIN' CONTRACTS_VERSION.md; then
            echo "::warning::Checksum uyuşmazlığı BEYAN EDİLMİŞ (PENDING_REPIN) — re-pin C8 release töreninde yapılır."
            echo "Tur içi ara re-pin, yayımlanmış etiketin checksum anlamını bozar; bu bilinçli bir kırmızıdır."
            exit 0
          fi

          echo "::error::BEYAN EDİLMEMİŞ checksum uyuşmazlığı — ya 'python3 tools/pin_version.py' ile re-pin edin"
          echo "::error::ya CONTRACTS_VERSION.md'ye '**Checksum State:** PENDING_REPIN' beyanını gerekçesiyle ekleyin."
          exit 1

  lint-openapi:
    name: Lint OpenAPI Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI specs
        run: |
          spectral lint api/**/*.yaml --fail-severity=warn || echo "OpenAPI linting completed"
        continue-on-error: true

  check-forbidden-fields:
    name: Check for Forbidden Fields
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for email/tckn/otp
        run: |
          # Forbidden fields per KR-050
          FORBIDDEN="email|e_mail|tckn|tc_kimlik_no|otp|one_time_password"

          echo "Checking for forbidden fields: $FORBIDDEN"

          # Search in schema files
          if grep -r -i -E "\"($FORBIDDEN)\"" schemas/; then
            echo "::error::Forbidden fields found in schemas!"
            echo "::error::Per KR-050: NO email, NO TCKN, NO OTP allowed"
            exit 1
          fi

          echo "✅ No forbidden fields found"

  check-draft-2020-12:
    name: Check Draft 2020-12 Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check \$schema version
        run: |
          echo "Checking all schemas use Draft 2020-12..."

          # Find schemas not using 2020-12
          INVALID=$(find schemas -name "*.json" -exec grep -L "draft/2020-12" {} \;)

          if [ -n "$INVALID" ]; then
            echo "::error::The following schemas do not use Draft 2020-12:"
            echo "$INVALID"
            exit 1
          fi

          echo "✅ All schemas use Draft 2020-12"

  check-brand-guard:
    name: Check Brand Guard (no foreign-brand leakage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run brand guard
        run: |
          # tarlaanaliz-contracts is synced from a sibling contracts repo.
          # This guard fails the build if that sibling brand/region leaks back in.
          python3 tools/check_no_egeanaliz.py

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-schemas, test-schemas, detect-breaking-changes, verify-checksums, check-forbidden-fields, check-draft-2020-12, check-brand-guard]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Schema Validation: ${{ needs.validate-schemas.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Schema Tests: ${{ needs.test-schemas.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Breaking Changes: ${{ needs.detect-breaking-changes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Checksum Verification: ${{ needs.verify-checksums.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Forbidden Fields: ${{ needs.check-forbidden-fields.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Draft 2020-12: ${{ needs.check-draft-2020-12.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Brand Guard: ${{ needs.check-brand-guard.result }}" >> $GITHUB_STEP_SUMMARY

      # `detect-breaking-changes` push olayında 'skipped' döner (PR-only iş) — 'skipped'
      # kabul edilir, 'failure' KABUL EDİLMEZ. `verify-checksums` D1 ile bu listeye girdi.
      - name: Fail if critical checks failed
        if: |
          needs.validate-schemas.result == 'failure' ||
          needs.test-schemas.result == 'failure' ||
          needs.detect-breaking-changes.result == 'failure' ||
          needs.verify-checksums.result == 'failure' ||
          needs.check-forbidden-fields.result == 'failure' ||
          needs.check-draft-2020-12.result == 'failure' ||
          needs.check-brand-guard.result == 'failure'
        run: |
          echo "::error::Critical validation checks failed!"
          exit 1
